<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noella Chase Designz - Test Deployment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 0%, #e0c3fc 30%, #8ec5fc 70%, #ff9a9e 100%);
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { 
            margin: 0 0 1rem 0; 
            color: #764ba2;
        }
        p { 
            opacity: 0.8; 
            color: #555;
        }
        .status { 
            margin-top: 2rem; 
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #ff6b9d 100%);
            border-radius: 10px;
            font-weight: bold;
            color: white;
        }
        .download-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #764ba2;
        }
        .download-section h2 {
            color: #764ba2;
            margin-top: 0;
            font-size: 1.2rem;
        }
        .download-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Noella Chase Designz</h1>
        <p>Test deployment successful!</p>
        <p>GitHub to Vercel pipeline is working perfectly.</p>
        <div class="status">✅ Deployment Active - White, Purple & Pink!</div>
        
        <div class="download-section">
            <h2>📥 Digital Download Test</h2>
            <p>Sample digital product delivery</p>
            <a href="downloads/sample-product.txt" download class="download-btn">
                Download Sample Product
            </a>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.9rem;">
            Deployed: <span id="date"></span>
        </p>
    </div>
    <script>
        document.getElementById('date').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
